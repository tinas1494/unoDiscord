plugins {
    id 'java'
    id 'application'
}

group 'org.example'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
    jcenter()
}

dependencies {

    compile 'net.dv8tion:JDA:4.2.0_179'
   // compile 'net.dv8tion:JDA:4.3.0_281'
    compile 'com.jagrosh:jda-utilities:3.0.4'

}